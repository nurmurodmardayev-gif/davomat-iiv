<script type="module">

// ════════════════════════════════════════════════════

const FIREBASE_CONFIG = {

// ════════════════════════════════════════════════════
//  COLLECTION NOMLARI — admin.html bilan mos
// ════════════════════════════════════════════════════
const COL_STAFF      = 'staff';
const COL_ATTENDANCE = 'attendance';

// ════════════════════════════════════════════════════
//  1. FAQAT MOBIL QURILMA TEKSHIRUVI
//  Kompyuter/noutbukdan kirish to'liq bloklanadi
// ════════════════════════════════════════════════════
function isMobileDevice() {
  const ua = navigator.userAgent || '';
  const hasTouchPoints = navigator.maxTouchPoints > 1;
  const mobileUA = /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(ua);

  // iPad iOS 13+ da userAgent "Macintosh" ko'rinadi — touchPoints bilan ajratamiz
  const isIpadOS = /Macintosh/i.test(ua) && hasTouchPoints && navigator.platform === 'MacIntel';

  // Windows plansheti (Surface va h.k.)
  const isWinTablet = /Windows/i.test(ua) && hasTouchPoints && /Touch/i.test(ua);

  return mobileUA || isIpadOS || isWinTablet;
}

function checkMobileOnly() {
  if (!isMobileDevice()) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'block';
    document.getElementById('err-msg').innerHTML =
      `<div style="font-size:32px;margin-bottom:12px">📱</div>
       <strong style="color:#f87171">Faqat mobil qurilmalardan foydalanish mumkin</strong><br><br>
       Bu tizim faqat smartfon yoki planshetdan ishlaydi.<br>
       Kompyuter va noutbukdan kirish ruxsat etilmagan.`;
    return false;
  }
  return true;
}

// ════════════════════════════════════════════════════
//  2. QURILMA FINGERPRINT (Device ID)
//  localStorage EMAS — hardware xususiyatlaridan yasaladi
//  Brauzerdan mustaqil: Chrome, Firefox, Safari — bir xil ID
//  Birinchi kirishda Firebase ga saqlanadi (staff doc ichida)
// ════════════════════════════════════════════════════

async function buildHardwareFingerprint() {
  const parts = [];

  // 1. Ekran o'lchami + piksel zichligi — qurilmaga xos
  parts.push(`${screen.width}x${screen.height}x${screen.colorDepth}x${window.devicePixelRatio||1}`);

  // 2. Protsessor yadrolari soni
  parts.push(`cpu:${navigator.hardwareConcurrency || 0}`);

  // 3. Vaqt zonasi
  parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone);

  // 4. Til
  parts.push(navigator.language || '');

  // 5. Qurilma xotirasi (GB, faqat Chrome/Android da ishlaydi)
  parts.push(`mem:${navigator.deviceMemory || 0}`);

  // 6. GPU renderer — WebGL orqali (brauzerdan mustaqil, qurilmaga xos)
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        parts.push(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
        parts.push(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
      }
    }
  } catch(e) {}

  // 7. AudioContext fingerprint — qurilma audio chipiga xos
  try {
    const ac = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100, 44100);
    const osc = ac.createOscillator();
    const analyser = ac.createAnalyser();
    osc.connect(analyser);
    analyser.connect(ac.destination);
    osc.start(0);
    const buf = await ac.startRendering();
    const data = buf.getChannelData(0).slice(0, 50);
    const sum = data.reduce((a, b) => a + Math.abs(b), 0);
    parts.push(`audio:${sum.toFixed(8)}`);
  } catch(e) {}

  // 8. Touch nuqtalari soni
  parts.push(`touch:${navigator.maxTouchPoints||0}`);

  const raw = parts.join('||');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 32);
}

// deviceId ni global saqlash
let currentDeviceId = null;

async function initDeviceId() {
  // Avval localStorage dan tekshiramiz (tezlik uchun cache)
  const CACHE_KEY = 'dav_hwfp_v3';
  let cached = null;
  try { cached = localStorage.getItem(CACHE_KEY); } catch(e) {}

  if (cached && cached.length === 32) {
    currentDeviceId = cached;
    return;
  }

  // Hardware fingerprint hisoblash
  currentDeviceId = await buildHardwareFingerprint();

  // Cache ga yozish (tezroq keyingi yuklash uchun)
  try { localStorage.setItem(CACHE_KEY, currentDeviceId); } catch(e) {}
}

// ════════════════════════════════════════════════════
//  XAVFSIZLIK: Brute-force himoya (sessionStorage)
// ════════════════════════════════════════════════════
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS   = 5 * 60 * 1000;
const LOCK_KEY     = 'dav_emp_lock_v2';

function checkLockout() {
  try {
    const raw = sessionStorage.getItem(LOCK_KEY);
    if (!raw) return false;
    const lock = JSON.parse(raw);
    if (Date.now() < lock.until) return lock;
    sessionStorage.removeItem(LOCK_KEY);
  } catch(e) { sessionStorage.removeItem(LOCK_KEY); }
  return false;
}

function recordFailedAttempt() {
  let attempts = 0;
  try {
    const raw = sessionStorage.getItem(LOCK_KEY);
    if (raw) { const d = JSON.parse(raw); attempts = d.attempts || 0; }
  } catch(e) {}
  attempts++;
  if (attempts >= MAX_ATTEMPTS) {
    sessionStorage.setItem(LOCK_KEY, JSON.stringify({ until: Date.now() + LOCKOUT_MS, attempts }));
    return { locked: true, until: Date.now() + LOCKOUT_MS };
  }
  sessionStorage.setItem(LOCK_KEY, JSON.stringify({ attempts, until: 0 }));
  return { locked: false, attempts, remaining: MAX_ATTEMPTS - attempts };
}

function clearAttempts() { sessionStorage.removeItem(LOCK_KEY); }

// Config cache — render har chaqirilganda Firebase ga bormasin
let _configCache = null;
let _configCacheTime = 0;
const CONFIG_TTL = 60 * 60 * 1000; // 1 soat (config kamdan-kam o'zgaradi)
const CONFIG_SS_KEY = 'dav_cfg_v1';  // sessionStorage cache

async function loadConfig() {
  const now = Date.now();

  // 1. Xotira keshi — eng tez
  if (_configCache && (now - _configCacheTime) < CONFIG_TTL) {
    return _configCache;
  }

  // 2. sessionStorage keshi — sahifa yangilansa ham saqlanadi
  try {
    const raw = sessionStorage.getItem(CONFIG_SS_KEY);
    if (raw) {
      const cached = JSON.parse(raw);
      if (now - cached._ts < CONFIG_TTL) {
        _configCache = cached;
        _configCacheTime = cached._ts;
        return _configCache;
      }
    }
  } catch(e) {}

  // 3. Firebase dan yuklash (birinchi ochilishda yoki 1 soatdan keyin)
  try {
    const snap = await getDoc(doc(db, 'config', 'app'));
    if (snap.exists()) {
      const d = snap.data();
      _configCache = {
        workStart:    d.workStart    || '08:00',
        workEnd:      d.workEnd      || '09:00',
        leaveStart:   d.leaveStart   || '17:00',
        leaveEnd:     d.leaveEnd     || '18:00',
        locationLat:  parseFloat(d.lat)    || 0,
        locationLng:  parseFloat(d.lon)    || 0,
        locationName: d.locationName || 'Ish joyi',
        radius:       parseInt(d.radius)   || 50,
        gpsEnabled:   true,
        _ts: now,
      };
      _configCacheTime = now;
      try { sessionStorage.setItem(CONFIG_SS_KEY, JSON.stringify(_configCache)); } catch(e) {}
      return _configCache;
    }
  } catch(e) {
    console.warn('Config yuklanmadi, default:', e.message);
  }
  _configCache = {
    workStart:'08:00', workEnd:'09:00',
    leaveStart:'17:00', leaveEnd:'18:00',
    locationLat:0, locationLng:0,
    locationName:'Ish joyi', radius:50,
    gpsEnabled: true, _ts: now,
  };
  _configCacheTime = now;
  return _configCache;
}

// Xodimni PIN bo'yicha topish + qurilma tekshiruvi
// ⚡ Optimizatsiya: barcha xodimni o'qimaydi — faqat mos PIN ni topadi (1 ta read)
async function findStaffByPin(pin) {
  const q = query(collection(db, COL_STAFF), where('pin', '==', pin));
  const snap = await getDocs(q);
  if (snap.empty) return null;
  const emp = { id: snap.docs[0].id, ...snap.docs[0].data() };

  // ── QURILMA TEKSHIRUVI ──────────────────────────
  // Agar xodimga qurilma bog'langan bo'lsa — solishtiramiz
  if (emp.boundDeviceId) {
    if (emp.boundDeviceId !== currentDeviceId) {
      // Noto'g'ri qurilma — maxsus xato obyektini qaytaramiz
      return { __wrongDevice: true, name: emp.name };
    }
  } else {
    // Birinchi marta kiryapti — qurilmani bog'laymiz
    await setDoc(doc(db, COL_STAFF, emp.id), {
      boundDeviceId: currentDeviceId,
      boundDeviceUA: (navigator.userAgent || '').slice(0, 120),
      boundAt: new Date().toISOString()
    }, { merge: true });
    emp.boundDeviceId = currentDeviceId;
  }
  return emp;
}

// Bugungi yozuvni o'qish
// doc ID: staffId_YYYY-MM-DD
async function loadTodayRecord(staffId, date) {
  const docId = staffId + '_' + date;
  const snap = await getDoc(doc(db, COL_ATTENDANCE, docId));
  if (snap.exists()) return { id: docId, ...snap.data() };
  return null;
}

// Davomat yozish
// existing — submitPin da allaqachon o'qilgan, qayta o'qimaydi (1 ta read tejaydi)
async function saveAttendance(staffId, staffName, staffPos, date, type, time, lat, lon, kelishStatus, ketishStatus, existing) {
  const docId = staffId + '_' + date;
  const base = existing
    ? { ...existing }
    : { staffId, staffName, staffPos: staffPos || '', date, createdAt: serverTimestamp() };

  if (type === 'in') {
    base.kelish       = time;
    base.kelishAt     = new Date().toISOString();
    base.kelishStatus = kelishStatus || "O'z vaqtida";
    if (lat != null) { base.kelishLat = lat; base.kelishLon = lon; }
    // Qurilma ID saqlash
    if (currentDeviceId) {
      base.deviceId     = currentDeviceId;
      base.deviceUA     = (navigator.userAgent || '').slice(0, 120);
    }
  } else {
    base.ketish       = time;
    base.ketishAt     = new Date().toISOString();
    base.ketishStatus = ketishStatus || "O'z vaqtida ketdi";
    if (lat != null) { base.ketishLat = lat; base.ketishLon = lon; }
    // Ketish qurilmasi ham saqlanadi
    if (currentDeviceId) {
      base.ketishDeviceId = currentDeviceId;
    }
  }
  base.updatedAt = serverTimestamp();

  await setDoc(doc(db, COL_ATTENDANCE, docId), base, { merge: true });
}

//  HOLAT HISOBLASH
// ════════════════════════════════════════════════════
function tMin(t) {
  if (!t) return 0;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function curMin() {
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}

function calcKelishStatus(config) {
  return curMin() <= tMin(config.workStart) ? "O'z vaqtida" : 'Kech';
}

function calcKetishStatus(config) {
  return curMin() < tMin(config.leaveStart) ? 'Erta ketdi' : "O'z vaqtida ketdi";
}

function td() { return new Date().toISOString().split('T')[0]; }
function nowT() {
  const n = new Date();
  return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}

function updateClock() {
  const el = document.getElementById('clock');
  if (el) el.textContent = nowT();
  setTimeout(updateClock, 15000);
}

async function render() {
  const root = document.getElementById('root');
  if (!root) return;

  // Config: state.config bo'lsa ishlatamiz (har render da Firebase ga bormaymiz)
  let cfg;
  try {
    cfg = state.config || await loadConfig();
    state.config = cfg;
  }
  catch(e) { root.innerHTML = `<div class="alert al-e">Firebase xatosi: ${e.message}</div>`; return; }

  const cur = curMin();

  const inOk  = !cfg.workStart  || !cfg.workEnd  || (cur >= tMin(cfg.workStart)  && cur <= tMin(cfg.workEnd));
  const outOk = !cfg.leaveStart || !cfg.leaveEnd || (cur >= tMin(cfg.leaveStart) && cur <= tMin(cfg.leaveEnd));

  // Qadamlar
  const stepOrder = cfg.gpsEnabled ? ['type','pin','gps','confirm'] : ['type','pin','confirm'];

      <div style="display:flex;align-items:center">
        <div class="sn ${i<idx?'dn':i===idx?'ac':''}">${i<idx?'✓':i+1}</div>
        ${i<stepLabels.length-1?'<div class="sl"></div>':''}
      </div>`).join('')}</div>`;
  }

  const errBlock = state.error
    ? `<div class="alert al-e">${state.error} <span onclick="clearErr()" style="float:right;cursor:pointer">✕</span></div>`
    : '';

  let content = '';

  // ── TUR TANLASH ─────────────────────────────────
  if (state.step === 'type') {
    content = `
      <div class="card">
        <div class="ct">Davomat turi</div>
        <div class="cs">Kelayapsizmi yoki ketayapsizmi?</div>
        <div class="tg">
          <div class="tb ${!inOk?'off':''}" onclick="${inOk?'selectType(\'in\')':''}">
            <div class="ti">🏢</div>
            <div class="tl">Kelish</div>
            <div class="tt">${cfg.workStart}–${cfg.workEnd}</div>
          </div>
          <div class="tb ${!outOk?'off':''}" onclick="${outOk?'selectType(\'out\')':''}">
            <div class="ti">🏠</div>
            <div class="tl">Ketish</div>
            <div class="tt">${cfg.leaveStart}–${cfg.leaveEnd}</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--mu);text-align:center">
          ${cfg.gpsEnabled ? `📍 ${cfg.locationName} · Radius: ${cfg.radius}m` : '📍 GPS tekshiruvsiz rejim'}
        </div>
      </div>

      <div class="card">
        <div class="ct" style="margin-bottom:4px">Joriy holat</div>
        <div class="cs">Kelish/ketishdan mustaqil — istalgan vaqt belgilang</div>
        <div class="st-row">
          <div class="st-btn ${state.lunchActive?'lunch-on':''}" onclick="toggleLunch()">
            <div class="st-ic">🍽️</div>
            <div class="st-lb ${state.lunchActive?'o':'mu'}">${state.lunchActive?'Tushlikda':'Tushlik'}</div>
          </div>
          <div class="st-btn ${state.leaveActive?'leave-on':''}" onclick="toggleLeave()">
            <div class="st-ic">🏃</div>
            <div class="st-lb ${state.leaveActive?'p':'mu'}">${state.leaveActive?'Javoblashgan':'Javoblashgan'}</div>
          </div>
          <div class="st-btn ${state.shiftActive?'shift-on':''}" onclick="toggleShift()">
            <div class="st-ic">🔄</div>
            <div class="st-lb ${state.shiftActive?'b':'mu'}">${state.shiftActive?'Smenada':'Smena'}</div>
          </div>
          <div class="st-btn ${state.tripActive?'trip-on':''}" onclick="toggleTrip()">
            <div class="st-ic">✈️</div>
            <div class="st-lb ${state.tripActive?'w':'mu'}">${state.tripActive?'Xizmat safari':'Xizmat safari'}</div>
          </div>
        </div>
        <div style="font-size:10px;color:var(--mu);text-align:center;line-height:1.5">
          Status o'zgarishi admin va rahbar dashboardida ko'rinadi
        </div>
      </div>
    `;
  }

  // ── PIN KIRISH ──────────────────────────────────
  else if (state.step === 'pin' || state.step === 'status-pin') {
    const lock = checkLockout();
    let lockMsg = '';
    if (lock && lock.locked) {
      const r = Math.ceil((lock.until - Date.now()) / 1000);
      const m = Math.floor(r/60), s = r%60;
      lockMsg = `<div class="alert al-e">🔒 ${MAX_ATTEMPTS} ta noto'g'ri urinish. ${m}:${String(s).padStart(2,'0')} kuting</div>`;
    }
    const pinTitle = state.step === 'status-pin'
      ? `${state._statusPending?.emoji || '📋'} ${state._statusPending?.label || 'Status'} — PIN kiriting`
      : (state.type==='in'?'🏢 Kelish':'🏠 Ketish') + ' — PIN kiriting';
    content = `
      <div class="card">
        <div class="ct">${pinTitle}</div>
        <div class="cs">Sizga berilgan 4 xonali PIN kodni kiriting</div>
        ${lockMsg}
        <div class="pin-wrap">
          ${Array.from({length:4}).map((_,i) => {
            const d = state.pin[i] || '';
            return `<div class="pin-box ${i===state.pin.length&&!state._pinErr?'ac':''} ${d?'fi':''} ${state._pinErr?'err':''}">${d?'●':''}</div>`;
          }).join('')}
        </div>
        ${!lock?.locked ? `<div class="kp">
          ${['1','2','3','4','5','6','7','8','9','del','0','ok'].map(k=>`
            <div class="key ${k==='del'?'dl':''} ${k==='ok'?'ok':''}" onclick="pinKey('${k}')">${k==='del'?'⌫':k==='ok'?'✓':k}</div>
          `).join('')}
        </div>` : ''}
      </div>
      <button class="btn bo" onclick="goBack()">← Orqaga</button>
    `;
  }

  // ── GPS TEKSHIRUV ───────────────────────────────
  else if (state.step === 'gps') {
    const gClass   = state.gpsStatus==='ok'?'ok':state.gpsStatus==='err'?'err':'loading';
    const dotClass = state.gpsStatus==='ok'?'dg':state.gpsStatus==='err'?'dr':'dw';
    const gMsg     = state.gpsStatus==='loading'
      ? '📡 Joylashuv aniqlanmoqda...'
      : state.gpsStatus==='ok' ? state.gpsMsg : (state.gpsMsg || 'GPS xatosi');

    // Doirasimon taymer (20 soniya, faqat loading/ok paytida)
    const TIMER_TOTAL = 20;
    const timerSec = state._gpsTimerSec != null ? state._gpsTimerSec : TIMER_TOTAL;
    const R = 36, C = 2 * Math.PI * R;
    const progress = timerSec / TIMER_TOTAL;
    const offset = C * (1 - progress);
    const timerDone = timerSec <= 0;
    const showTimer = state.gpsStatus !== 'err';
    const timerBlock = showTimer ? `
      <div class="gps-timer-wrap">
        <svg class="gps-timer-svg" width="90" height="90" viewBox="0 0 90 90">
          <circle class="gps-timer-track" cx="45" cy="45" r="${R}"/>
          <circle class="gps-timer-bar ${timerDone?'done':''}"
            cx="45" cy="45" r="${R}"
            stroke-dasharray="${C}"
            stroke-dashoffset="${offset}"/>
          <text class="gps-timer-num" x="45" y="45" text-anchor="middle" dominant-baseline="central"
            transform="rotate(90,45,45)">${timerSec}</text>
        </svg>
        <div class="gps-timer-label">${timerDone?'✓ Tayyor':'Tezroq bajaring!'}</div>
      </div>` : '';

    content = `
      <div class="card">
        <div class="ct">📍 GPS tekshiruvi — Majburiy</div>
        <div class="cs">${state.staffName} — ${state.type==='in'?'Kelish':'Ketish'}</div>
        ${timerBlock}
        <div class="gps ${gClass}">
          <div class="dot ${dotClass}"></div>
          <span>${gMsg}</span>
        </div>
        ${state.gpsStatus==='ok'
          ? `<button class="btn bp" onclick="continueGps()">Davom etish →</button>`
          : ''}
        ${state.gpsStatus==='err'
          ? `<div class="alert al-e" style="font-size:12px;margin-top:8px">
               ⛔ GPS tasdiqlanmasa davomat qayd etib bo'lmaydi.<br><br>
               <strong>Ruxsat berish uchun:</strong><br>
               Brauzer manzil satrida 🔒 belgisiga bosing → Joylashuv → Ruxsat bering
             </div>
             <button class="btn bo" style="margin-top:8px" onclick="startGps()">🔄 Qayta urinish</button>`
          : ''}
        ${state.gpsStatus==='loading'
          ? `<div style="font-size:11px;color:var(--mu);text-align:center;margin-top:8px">
               Joylashuv so'rovi paydo bo'lsa — "Ruxsat berish" tugmasini bosing
             </div>` : ''}
      </div>
      <button class="btn bo" onclick="goBack()" ${state.gpsStatus==='loading'?'disabled':''}>← Orqaga</button>
    `;
  }

  // ── TASDIQLASH ──────────────────────────────────
  else if (state.step === 'confirm') {
    const devShort = currentDeviceId ? currentDeviceId.slice(0,8).toUpperCase() : '——';
    content = `
      <div class="card">
        <div class="ct">🔐 Tasdiqlash</div>
        <div class="cs">${state.staffName}${state.staffPos?' · '+state.staffPos:''}</div>
        <div style="background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px">
          <div style="font-size:12px;color:var(--mu);margin-bottom:4px">Amal:</div>
          <div style="font-size:16px;font-weight:500">${state.type==='in'?'🏢 Kelish':'🏠 Ketish'}</div>
          <div style="font-family:var(--mono);font-size:24px;margin-top:8px">${nowT()}</div>
          <div style="font-size:12px;color:var(--mu);margin-top:2px">${td()}</div>
          ${state.gpsLat ? `<div style="font-size:11px;color:var(--g);margin-top:6px">📍 GPS tasdiqlangan</div>` : ''}
          <div style="font-size:10px;color:var(--mu);margin-top:6px;font-family:var(--mono)">📱 Qurilma: ${devShort}</div>
        </div>
        <div class="fp-area">
          <div class="fp-btn ${state.fpState==='scanning'?'sc':state.fpState==='success'?'ok':''}" onclick="scanFp()">
            <div class="fp-ic">${state.fpState==='success'?'✅':state.fpState==='scanning'?'⏳':'👆'}</div>
            <div class="fp-lb">${state.fpState==='success'?'Tasdiqlandi!':state.fpState==='scanning'?'Saqlanmoqda...':'Bosib tasdiqlang'}</div>
          </div>
        </div>
      </div>
      <button class="btn bo" onclick="goBack()" ${state.fpState==='scanning'?'disabled':''}>← Orqaga</button>
    `;
  }

  // ── NATIJA ──────────────────────────────────────
  else if (state.step === 'done' && state.result) {
    const r = state.result;
    content = `
      <div class="done">
        <div class="done-ic">${r.type==='in'?'✅':'👋'}</div>
        <div class="done-h">${r.type==='in'?'Kelish qayd etildi!':'Ketish qayd etildi!'}</div>
        <div class="done-n">${r.staffName}</div>
        <div class="done-t">${r.time}</div>
        <div class="done-d">${r.date}</div>
        <div style="font-size:12px;color:var(--g);margin-bottom:6px;font-family:var(--mono)">
          ${r.type==='in' ? r.kelishStatus : r.ketishStatus}
        </div>
        <div style="font-size:11px;color:var(--mu);margin-bottom:24px">Firebase ga saqlandi 🔥</div>
        <button class="btn bp" onclick="resetState()">Yangi amal</button>
      </div>
    `;
  }

  root.innerHTML = steps + errBlock + content;

  // ── FULLSCREEN STATUS EKRANI ─────────────────────
  // Eski ekranni o'chiramiz
  const oldScreen = document.getElementById('status-active-screen');
  if (oldScreen) oldScreen.remove();

  if (state.step === 'status-active' && state._statusActive) {
    const sa = state._statusActive;

    // Vaqt o'lchagich: startTs dan hozirga qadar
    function elapsedStr() {
      const diff = Math.floor((Date.now() - sa.startTs) / 1000);
      const h = Math.floor(diff / 3600);
      const m = Math.floor((diff % 3600) / 60);
      const s = diff % 60;
      if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    // Joriy vaqt
    function currentTimeStr() {
      const n = new Date();
      return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0') + ':' + String(n.getSeconds()).padStart(2,'0');
    }

    // Boshlangan vaqt (HH:MM)
    const startedAt = (() => {
      const d = new Date(sa.startTs);
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    })();

    const screen = document.createElement('div');
    screen.id = 'status-active-screen';
    screen.className = `st-screen ${sa.bgClass}`;
    screen.innerHTML = `
      <div class="st-screen-inner">
        <div class="st-big-ic">${sa.emoji}</div>
        <div class="st-label ${sa.color}">${sa.label}</div>
        <div class="st-name">${state.staffName || ''}</div>

        <div class="st-clock-wrap">
          <div class="st-clock" id="st-cur-time">${currentTimeStr()}</div>
          <div class="st-clock-lbl">JORIY VAQT</div>
        </div>

        <div class="st-timer-wrap">
          <div class="st-timer ${sa.color}" id="st-elapsed">${elapsedStr()}</div>
          <div class="st-clock-lbl">${startedAt} DAN BERI</div>
        </div>

        <button class="st-close-btn" onclick="closeStatusScreen()">✕ &nbsp; Statusni tugatish</button>
      </div>
    `;
    document.body.appendChild(screen);

    // Eski tick ni to'xtatamiz
    if (state._statusTick) { clearInterval(state._statusTick); state._statusTick = null; }

    // Har soniyada yangilash
    state._statusTick = setInterval(() => {
      const el = document.getElementById('st-elapsed');
      const ct = document.getElementById('st-cur-time');
      if (!el || !ct) { clearInterval(state._statusTick); state._statusTick = null; return; }
      el.textContent = elapsedStr();
      ct.textContent = currentTimeStr();
    }, 1000);
  }
}

// Bugungi davomat doc ID ni aniqlash
// Agar state.staffId ma'lum bo'lsa — to'g'ridan hisoblaydi (0 o'qish)
// Aks holda — qurilma ID bo'yicha staff kolleksiyasidan topamiz
// Doc ID format: staffId_YYYY-MM-DD
// MUHIM: doc hali mavjud bo'lmasa ham ID qaytaradi — status yozish uchun yangi doc yaratiladi
async function getTodayDocIdForDevice() {
  const today = td();

  // 1. state.staffId ma'lum bo'lsa — hech qanday Firestore so'rovsiz
  if (state.staffId) {
    return `${state.staffId}_${today}`;
  }

  // 2. staffId yo'q — qurilma ID bo'yicha faqat 1 ta xodimni topamiz (where query)
  try {
    const q = query(collection(db, COL_STAFF), where('boundDeviceId', '==', currentDeviceId));
    const snap = await getDocs(q);
    if (!snap.empty) {
      const found = snap.docs[0];
      state.staffId   = found.id;
      state.staffName = state.staffName || found.data().name || '';
      state.staffPos  = state.staffPos  || found.data().position || '';
      return `${found.id}_${today}`;
    }
  } catch(e) { return null; }
  return null;
}

// Status yozish uchun doc mavjudligini tekshirmaydi — yo'q bo'lsa yaratadi
async function upsertStatusDoc(docId, fields) {
  const snap = await getDoc(doc(db, COL_ATTENDANCE, docId));
  if (snap.exists()) {
    await updateDoc(doc(db, COL_ATTENDANCE, docId), {
      ...fields,
      updatedAt: serverTimestamp()
    });
  } else {
    // Doc yo'q — kelish qayd etilmagan, lekin status saqlaymiz
    const parts = docId.split('_');
    const date  = parts[parts.length - 1];
    const sId   = parts.slice(0, -1).join('_');
    await setDoc(doc(db, COL_ATTENDANCE, docId), {
      staffId:   sId,
      staffName: state.staffName || '',
      staffPos:  state.staffPos  || '',
      date,
      createdAt: serverTimestamp(),
      ...fields,
      updatedAt: serverTimestamp()
    }, { merge: true });
  }
}


// ── STATUS HELPER FUNKSIYALAR ──
function buildStatusFields(key, active) {
  const t = active ? new Date().toISOString() : null;
  const fields = { updatedAt: null }; // serverTimestamp upsertStatusDoc ichida qo'shiladi
  if (key === 'lunch') { fields.lunchStatus = active ? 'Tushlikda' : null; fields.lunchAt = t; }
  if (key === 'leave') { fields.liveStatus  = active ? 'Javoblashgan' : null; fields.liveStatusAt = t; }
  if (key === 'shift') { fields.shiftStatus = active ? 'Smenada' : null; fields.shiftAt = t; }
  if (key === 'trip')  { fields.tripStatus  = active ? 'Xizmat safari' : null; fields.tripAt = t; }
  delete fields.updatedAt; // upsertStatusDoc o'zi qo'shadi
  return fields;
}

function applyStatusToState(key, active) {
  if (key === 'lunch') { state.lunchActive = active; if (active) { state.leaveActive=false; state.shiftActive=false; state.tripActive=false; } }
  if (key === 'leave') { state.leaveActive = active; if (active) { state.lunchActive=false; state.shiftActive=false; state.tripActive=false; } }
  if (key === 'shift') { state.shiftActive = active; if (active) { state.lunchActive=false; state.leaveActive=false; state.tripActive=false; } }
  if (key === 'trip')  { state.tripActive  = active; if (active) { state.lunchActive=false; state.leaveActive=false; state.shiftActive=false; } }
}

// Status tugmasi bosilganda: PIN so'rab, keyin saqlaydi
function requestStatusPin(key, active, emoji, label) {
  state._statusPending = { key, active, emoji, label };
  state.step = 'status-pin';
  state.pin = '';
  state._pinErr = false;
  state.error = null;
  render();
}

// Fullscreen status ekranidan "Tugatish" bosilganda
window.closeStatusScreen = function() {
  if (!state._statusActive) return;
  // Qaysi key aktiv ekanini aniqlaymiz
  const keyMap = { 'Tushlikda':'lunch', 'Javoblashgan':'leave', 'Smenada':'shift', 'Xizmat safari':'trip' };
  const key = keyMap[state._statusActive.label] || 'lunch';
  // Tickni to'xtatamiz — PIN ekranida ticker shart emas
  if (state._statusTick) { clearInterval(state._statusTick); state._statusTick = null; }
  // PIN orqali o'chirish
  requestStatusPin(key, false, state._statusActive.emoji, state._statusActive.label + ' — tugatish');
};

// Sahifa ochilganda qurilma statusini Firebase dan yuklash
async function loadDeviceStatus() {
  const docId = await getTodayDocIdForDevice();
  if (!docId) return;
  try {
    const snap = await getDoc(doc(db, COL_ATTENDANCE, docId));
    if (snap.exists()) {
      const d = snap.data();
      state.lunchActive = d.lunchStatus === 'Tushlikda';
      state.leaveActive = d.liveStatus  === 'Javoblashgan';
      state.shiftActive = d.shiftStatus === 'Smenada';
      state.tripActive  = d.tripStatus  === 'Xizmat safari';

      // Agar aktiv status bo'lsa — fullscreen ekranni qayta tiklash
      const META = {
        lunch: { key:'lunch', bgClass:'lunch-bg', color:'o', emoji:'🍽️', label:'Tushlikda',    atField:'lunchAt'       },
        leave: { key:'leave', bgClass:'leave-bg', color:'p', emoji:'🏃', label:'Javoblashgan', atField:'liveStatusAt'  },
        shift: { key:'shift', bgClass:'shift-bg', color:'b', emoji:'🔄', label:'Smenada',      atField:'shiftAt'       },
        trip:  { key:'trip',  bgClass:'trip-bg',  color:'w', emoji:'✈️', label:'Xizmat safari',atField:'tripAt'        },
      };
      const activeKey = Object.keys(META).find(k => {
        if (k==='lunch') return state.lunchActive;
        if (k==='leave') return state.leaveActive;
        if (k==='shift') return state.shiftActive;
        if (k==='trip')  return state.tripActive;
      });
      if (activeKey) {
        const m = META[activeKey];
        // startTs: Firebase dan saqlangan ISO vaqt, yo'q bo'lsa hozir
        const atRaw = d[m.atField];
        const startTs = atRaw ? new Date(atRaw).getTime() : Date.now();
        state._statusActive = { ...m, startTs };
        state.step = 'status-active';
      }

      render();
    }
  } catch(e) { /* jimgina o'tamiz */ }
}

window.clearErr = function() { state.error = null; render(); };

window.goBack = function() {
  if (state._gpsTimerInterval) clearInterval(state._gpsTimerInterval);
  if (state._gpsAutoTimer) clearTimeout(state._gpsAutoTimer);
  // status-pin dan qaytish — 'type' ga
  if (state.step === 'status-pin') {
    state._statusPending = null;
    state.step = 'type';
    state.pin = '';
    state._pinErr = false;
    state.error = null;
    render(); return;
  }
  const cfg = state.config;
  const order = cfg?.gpsEnabled ? ['type','pin','gps','confirm'] : ['type','pin','confirm'];
  const idx = order.indexOf(state.step);
  if (idx > 0) { state.step = order[idx-1]; state.error = null; state._pinErr = false; render(); }
};

window.resetState = function() {
  if (state._gpsTimerInterval) clearInterval(state._gpsTimerInterval);
  if (state._gpsAutoTimer) clearTimeout(state._gpsAutoTimer);
  if (state._statusTick) { clearInterval(state._statusTick); }
  // Toast va status ekranini tozalaymiz
  const gt = document.getElementById('greet-toast');
  if (gt) gt.remove();
  const old = document.getElementById('status-active-screen');
  if (old) old.remove();
  state = {
    step:'type', type:null, pin:'',
    staffId:null, staffName:'', staffPos:'',
    gpsStatus:'idle', gpsMsg:'',
    gpsLat:null, gpsLon:null,
    fpState:'idle', error:null, result:null, loading:false,
    config:null,
    _kelishStatus:"O'z vaqtida",
    _ketishStatus:"O'z vaqtida ketdi",
    _todayRecord: null,
    _gpsRetry: 0,
    _gpsTimerSec: 20,
    _gpsBypassed: false,
    lunchActive: false,
    leaveActive: false,
    shiftActive: false,
    tripActive:  false,
    _statusPending: null,
    _statusActive: null,
    _statusTick: null,
  };
  render();
};

window.selectType = async function(type) {
  const cfg = await loadConfig();
  state.config = cfg;
  const cur = curMin();

  if (type === 'in') {
    if (cfg.workStart && cfg.workEnd) {
      if (cur < tMin(cfg.workStart) || cur > tMin(cfg.workEnd)) {
        state.error = `Kelish vaqti faqat ${cfg.workStart}–${cfg.workEnd} orasida`;
        render(); return;
      }
    }
  }
  if (type === 'out') {
    if (cfg.leaveStart && cfg.leaveEnd) {
      if (cur < tMin(cfg.leaveStart) || cur > tMin(cfg.leaveEnd)) {
        state.error = `Ketish vaqti faqat ${cfg.leaveStart}–${cfg.leaveEnd} orasida`;
        render(); return;
      }
    }
  }

  state._kelishStatus = calcKelishStatus(cfg);
  state._ketishStatus = calcKetishStatus(cfg);
  state.type = type;
  state.step = 'pin';
  state.error = null;
  state._pinErr = false;
  render();
};

window.pinKey = function(k) {
  const lock = checkLockout();
  if (lock && lock.locked) { render(); return; }

  if (k === 'del') {
    state.pin = state.pin.slice(0, -1);
    state._pinErr = false;
    render(); return;
  }
  if (k === 'ok') {
    if (state.pin.length >= 4) submitPin();
    return;
  }
  if (state.pin.length < 4) {
    state.pin += k;
    state._pinErr = false;
    render();
    if (state.pin.length === 4) setTimeout(submitPin, 150);
  }
};

async function submitPin() {
  if (state.loading) return;

  const lock = checkLockout();
  if (lock && lock.locked) {
    state.pin = '';
    render(); return;
  }

  state.loading = true;

  try {
    const emp = await findStaffByPin(state.pin);

    if (!emp) {
      const result = recordFailedAttempt();
      state._pinErr = true;
      if (result.locked) {
        state.error = `${MAX_ATTEMPTS} ta noto'g'ri urinish. 5 daqiqa bloklandingiz.`;
      } else {
        state.error = `Noto'g'ri PIN. Qolgan urinish: ${result.remaining}`;
      }
      state.pin = '';
      state.loading = false;
      render(); return;
    }

    // Noto'g'ri qurilma — boshqa telefon ishlatilmoqda
    if (emp.__wrongDevice) {
      state._pinErr = true;
      state.error = `⛔ ${emp.name} — bu qurilma ruxsatsiz.\nSizning davomatingiz boshqa telefonga bog'langan. Admin bilan bog'laning.`;
      state.pin = '';
      state.loading = false;
      render(); return;
    }

    // Muvaffaqiyatli PIN — urinishlarni tozalash
    clearAttempts();

    state.staffId   = emp.id;
    state.staffName = emp.name;
    state.staffPos  = emp.position || emp.dept || '';
    state.loading   = false;

    // ══════════════════════════════════════════════════════
    //  STATUS-PIN rejimi — kelish/ketishdan TO'LIQ MUSTAQIL
    //  Xodim uyidan, yo'ldan, istalgan joydan status belgilashi mumkin.
    //  loadTodayRecord, kelish/ketish tekshiruvlari bu yerda ISHLAMAYDI.
    // ══════════════════════════════════════════════════════
    if (state.step === 'status-pin' && state._statusPending) {
      const { key, active, emoji, label } = state._statusPending;
      const docId = `${emp.id}_${td()}`;
      try {
        await upsertStatusDoc(docId, buildStatusFields(key, active));
        applyStatusToState(key, active);
      } catch(e2) {
        state.error = 'Status saqlashda xato: ' + e2.message;
        state._statusPending = null;
        state.step = 'type';
        state.pin = '';
        render();
        return;
      }
      state._statusPending = null;
      state.pin = '';
      state._pinErr = false;

      if (active) {
        // Status yoqildi — fullscreen ekran ko'rsatamiz
        const META = {
          lunch: { bgClass:'lunch-bg', color:'o', emoji:'🍽️', label:'Tushlikda' },
          leave: { bgClass:'leave-bg', color:'p', emoji:'🏃', label:'Javoblashgan' },
          shift: { bgClass:'shift-bg', color:'b', emoji:'🔄', label:'Smenada'     },
          trip:  { bgClass:'trip-bg',  color:'w', emoji:'✈️', label:'Xizmat safari'},
        };
        const m = META[key] || { bgClass:'leave-bg', color:'p', emoji:'📋', label };
        state._statusActive = { ...m, startTs: Date.now() };
        state.step = 'status-active';
      } else {
        // Status o'chirildi — oddiy ekranga qaytamiz
        if (state._statusTick) { clearInterval(state._statusTick); state._statusTick = null; }
        state._statusActive = null;
        state.step = 'type';
      }
      render();
      return;
    }

    // ══════════════════════════════════════════════════════
    //  DAVOMAT rejimi — kunlik bir marta tekshiruv
    //  (faqat Kelish / Ketish uchun)
    // ══════════════════════════════════════════════════════
    const today = td();
    const existing = await loadTodayRecord(emp.id, today);

    if (state.type === 'in' && existing?.kelish) {
      state.error = `${emp.name} bugun allaqachon keldi (${existing.kelish}).`;
      state.pin = ''; state.loading = false; render(); return;
    }
    if (state.type === 'out' && existing?.ketish) {
      state.error = `${emp.name} bugun allaqachon ketdi (${existing.ketish}).`;
      state.pin = ''; state.loading = false; render(); return;
    }
    if (state.type === 'out' && !existing?.kelish) {
      state.error = '⚠️ Avval kelish qayd etilmagan. Ketish mumkin emas.';
      state.pin = ''; state.loading = false; render(); return;
    }

    // existing ni state da saqlaymiz — finalizeAttendance qayta o'qimaydi
    state._todayRecord = existing || null;

    const cfg = state.config || await loadConfig();
    if (cfg.gpsEnabled) {
      state.step = 'gps';
      state.error = null;
      render();
      startGps();
    } else {
      state.step = 'confirm';
      state.error = null;
      render();
    }

  } catch(e) {
    state.error = 'Firebase xatosi: ' + e.message;
    state.pin = '';
    state.loading = false;
    render();
  }
}

window.startGps = function() {
  state.gpsStatus = 'loading';
  state.gpsMsg = '';
  state._gpsRetry = (state._gpsRetry || 0);
  state._gpsTimerSec = 20;
  state._gpsBypassed = false;
  render();

  // ── 20 soniyalik doirasimon taymer (ko'rinma, chalg'itish) ──
  if (state._gpsTimerInterval) clearInterval(state._gpsTimerInterval);
  state._gpsTimerInterval = setInterval(() => {
    if (state.step !== 'gps') { clearInterval(state._gpsTimerInterval); return; }
    state._gpsTimerSec = Math.max(0, (state._gpsTimerSec || 0) - 1);
    render();
    if (state._gpsTimerSec <= 0) clearInterval(state._gpsTimerInterval);
  }, 1000);

  // ── 10 soniyalik navbatchi bypass ──
  if (state._gpsAutoTimer) clearTimeout(state._gpsAutoTimer);
  state._gpsAutoTimer = setTimeout(() => {
    // Faqat hali GPS OK bo'lmagan va hali gps bosqichida bo'lsa
    if (state.step === 'gps' && state.gpsStatus !== 'ok') {
      clearInterval(state._gpsTimerInterval);
      state._gpsBypassed = true;
      state.gpsLat = null;
      state.gpsLon = null;
      state.step = 'confirm';
      state.error = null;
      render();
    }
  }, 10000);

  if (!navigator.geolocation) {
    state.gpsStatus = 'err';
    state.gpsMsg = "Qurilmangiz GPS ni qo'llamaydi";
    render(); return;
  }

  navigator.geolocation.getCurrentPosition(
    async pos => {
      const cfg = state.config || await loadConfig();
      const accuracy = pos.coords.accuracy; // metrda GPS aniqligi

      const R = 6371000;
      const dLat = (pos.coords.latitude  - cfg.locationLat) * Math.PI / 180;
      const dLon = (pos.coords.longitude - cfg.locationLng) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2
        + Math.cos(cfg.locationLat * Math.PI/180)
        * Math.cos(pos.coords.latitude * Math.PI/180)
        * Math.sin(dLon/2)**2;
      const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      // GPS aniqligi juda past bo'lsa (masalan, 200m) va hali retry qolgan bo'lsa —
      // bir marta avtomatik qayta urinib ko'ramiz
      if (accuracy > 100 && state._gpsRetry < 1) {
        state._gpsRetry = 1;
        state.gpsMsg = `📡 Aniqlik past (±${Math.round(accuracy)}m), qayta aniqlanmoqda...`;
        render();
        setTimeout(() => {
          navigator.geolocation.getCurrentPosition(
            pos2 => processGpsResult(pos2, cfg),
            () => processGpsResult(pos, cfg), // ikkinchi urinish ham xato bo'lsa — birinchi natijani ishlatamiz
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
          );
        }, 1500);
        return;
      }

      processGpsResult(pos, cfg);
    },
    err => {
      state.gpsStatus = 'err';
      state.gpsMsg = err.code === 1
        ? "Joylashuvga ruxsat berilmagan. Brauzer sozlamalarida ruxsat bering."
        : err.code === 3
        ? 'GPS signal topilmadi. Ochiq joyga chiqib qayta urining.'
        : 'GPS xatosi: ' + err.message;
      state._gpsRetry = 0;
      render();
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 }
  );
};

function processGpsResult(pos, cfg) {
  // Bypass bo'lgan bo'lsa yoki step o'zgargan bo'lsa — natijani e'tiborsiz qoldiramiz
  if (state.step !== 'gps') return;

  const accuracy = pos.coords.accuracy;
  const R = 6371000;
  const dLat = (pos.coords.latitude  - cfg.locationLat) * Math.PI / 180;
  const dLon = (pos.coords.longitude - cfg.locationLng) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2
    + Math.cos(cfg.locationLat * Math.PI/180)
    * Math.cos(pos.coords.latitude * Math.PI/180)
    * Math.sin(dLon/2)**2;
  const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  state.gpsLat = pos.coords.latitude;
  state.gpsLon = pos.coords.longitude;
  state._gpsRetry = 0;

  if (dist <= cfg.radius) {
    state.gpsStatus = 'ok';
    state.gpsMsg = `✓ Hududda (${Math.round(dist)}m masofada · ±${Math.round(accuracy)}m aniqlik)`;
  } else {
    state.gpsStatus = 'err';
    // Aniqlik past bo'lsa — alohida tushuntirish
    if (accuracy > cfg.radius * 1.5) {
      state.gpsMsg = `GPS aniqligi past (±${Math.round(accuracy)}m). Tashqariga chiqib, qayta urining.`;
    } else {
      state.gpsMsg = `Hududdan ${Math.round(dist - cfg.radius)}m tashqaridasiz. Ish joyiga yaqinroq keling.`;
    }
    state.gpsLat = null;
    state.gpsLon = null;
  }
  render();
}

window.continueGps = function() {
  if (state.gpsStatus !== 'ok') return;
  if (state._gpsTimerInterval) clearInterval(state._gpsTimerInterval);
  if (state._gpsAutoTimer) clearTimeout(state._gpsAutoTimer);
  state.step = 'confirm';
  render();
};

window.scanFp = function() {
  if (state.fpState !== 'idle') return;
  state.fpState = 'scanning';
  render();

  async function tryBiometric() {
    try {
      if (window.PublicKeyCredential) {
        const avail = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if (avail) {
          await navigator.credentials.get({
            publicKey: {
              challenge: crypto.getRandomValues(new Uint8Array(32)),
              timeout: 30000,
              userVerification: 'preferred'
            }
          });
        }
      }
    } catch(e) {
      // Biometrik muvaffaqiyatsiz bo'lsa ham davom etamiz
      console.log('Biometrik:', e.name);
    }
    finalizeAttendance();
  }

  setTimeout(tryBiometric, 800);
};

//  TABRIQ TOAST — kelish / ketish tasdiqlanganda
// ════════════════════════════════════════════════════
function showGreetToast(type) {
  const isIn = type === 'in';
  const emoji    = isIn ? '☀️' : '🌙';
  const text     = isIn ? 'Xayrli kun, charchamang!' : 'Halol mehnatingiz uchun rahmat!';
  const sub      = isIn ? "Bugungi kuningiz samarali o'tsin" : 'Uyga omon-eson boring';
  const barColor = isIn ? 'var(--g)' : 'var(--b)';

  const old = document.getElementById('greet-toast');
  if (old) old.remove();

  const el = document.createElement('div');
  el.id = 'greet-toast';
  el.className = 'greet-toast';
  el.innerHTML = `
    <div class="greet-box" id="greet-box">
      <span class="greet-emoji">${emoji}</span>
      <div class="greet-text">${text}</div>
      <div class="greet-sub">${sub}</div>
      <div class="greet-bar"><div class="greet-bar-fill" style="background:${barColor}"></div></div>
    </div>`;
  document.body.appendChild(el);

  // 4.6 soniyada yashiramiz (progress bar bilan sinxron)
  setTimeout(() => {
    const box = document.getElementById('greet-box');
    if (box) box.classList.add('greet-out');
    setTimeout(() => { el.remove(); }, 380);
  }, 4600);
}

async function finalizeAttendance() {
  const time  = nowT();
  const today = td();
  try {
    await saveAttendance(
      state.staffId, state.staffName, state.staffPos,
      today, state.type, time,
      state.gpsLat, state.gpsLon,
      state._kelishStatus,
      state._ketishStatus,
      state._todayRecord   // ← submitPin da o'qilgan, qayta o'qilmaydi
    );
    state.fpState = 'success';
    state.result  = {
      type:         state.type,
      staffName:    state.staffName,
      time, date:   today,
      kelishStatus: state._kelishStatus,
      ketishStatus: state._ketishStatus,
    };
    const attendanceType = state.type; // render dan oldin saqlab olamiz
    render();
    setTimeout(() => {
      state.step = 'done';
      render();
      // done sahifasi render bo'lgandan keyin toast chiqamiz
      requestAnimationFrame(() => showGreetToast(attendanceType));
    }, 700);
  } catch(e) {
    state.fpState = 'idle';
    state.error   = 'Saqlashda xato: ' + e.message;
    render();
  }
}

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════
(async function init() {
  // 1. Birinchi navbatda — faqat mobil tekshiruvi
  if (!checkMobileOnly()) return;

  // 2. Qurilma ID ni yaratish/olish
  await initDeviceId();

  // 3. Firebase ulanish
  const ok = await initFirebase();

  if (!ok) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'block';
    document.getElementById('err-msg').textContent =
      'Firebase ga ulanib bo\'lmadi. Internet ulanishingizni tekshiring.';
    return;
  }

  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  updateClock();
  render();
  // Qurilmaning bugungi statusini yuklash
  loadDeviceStatus();
})();
</script>
</body>
</html>
